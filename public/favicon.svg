  <rect width="64" height="64" rx="14" fill="#2b1f19"/>
  <path d="M15 20 L29 32 L15 44" fill="none" stroke="#e0784a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="33" y="39" width="17" height="7" rx="2" fill="#f7eee6">
